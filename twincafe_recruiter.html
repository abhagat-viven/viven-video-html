<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwinCafe · Recruiter · setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Setup pass. Fixed light stage. Motion is Web Animations + a pausable clock.
   Placeholder scenes fade in and hold. Choreography comes later, scene by scene. */
:root{
  color-scheme:light;
  --canvas:#F5F3F0; --surface:#FFFFFF; --ink:#16141A; --ink-2:#5F5B66; --ink-3:#9A96A0;
  --line:rgba(22,20,26,.09); --purple:#3B1A6B; --purple-2:#5B3A94; --purple-tint:#F1ECF8;
  --green:#22C55E; --call:#1E1F25;
  --shadow:0 1px 2px rgba(22,20,26,.04),0 14px 44px rgba(22,20,26,.08);
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Inter Tight','Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);overflow:hidden}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center;background:var(--canvas)}
#cam{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.scene.on{display:flex}
.scene.dark{background:var(--call)}

.frame{width:1344px;max-width:1344px;position:relative;z-index:1}
.titlecard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.haze{position:absolute;inset:0;background:
  radial-gradient(980px 760px at 0% 0%,#C4B2EE 0%,transparent 68%),
  radial-gradient(860px 680px at 100% 0%,#E3D8F8 0%,transparent 66%),
  radial-gradient(900px 720px at 0% 100%,#F5D6C8 0%,transparent 68%),
  radial-gradient(880px 700px at 100% 100%,#F3BED2 0%,transparent 68%),
  var(--canvas)}
.t1,.t2{margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:84px;line-height:1.08;letter-spacing:-.035em;color:var(--ink);max-width:1560px;text-wrap:balance}
.t2{margin-top:28px}
.w{opacity:0;color:#9A96A0}
.titlecard.ready .w{opacity:1;color:var(--ink)}
.h2{margin:0 0 28px;text-align:center;font-family:var(--display);font-weight:600;font-size:52px;letter-spacing:-.03em;line-height:1.1}

.stack{display:flex;flex-direction:column;align-items:center}
.split{display:flex;align-items:center;justify-content:center;gap:32px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.missing{display:flex;align-items:center;justify-content:center;text-align:center;background:#E6E2DC;color:var(--ink-2);
  font-size:14px;font-weight:600;line-height:1.25;padding:8px;overflow:hidden}
.avatar{border-radius:50%;overflow:hidden;flex:none;background:#E6E2DC}
.avatar.missing{display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.15;padding:5px;word-break:break-word;text-align:center;color:var(--ink-2)}
.avatar.initials{display:flex;align-items:center;justify-content:center;padding:0;line-height:1;font-weight:600;letter-spacing:.02em;word-break:normal;text-align:center;color:var(--ink)}
.avatar img,.cover img,.video-slot video{width:100%;height:100%;object-fit:cover;display:block}
.video-slot .missing,.cover .missing{width:100%;height:100%}
.cover,.video-slot{overflow:hidden;background:#E6E2DC}
.logo{width:420px;height:auto;display:block}

.twin{width:1040px;padding:36px 40px 32px}
.twin-h{display:flex;align-items:center;gap:22px}
.twin-id{flex:1;min-width:0}
.twin-id .nm{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1}
.twin-id .role{margin-top:6px;font-size:22px;color:var(--ink-2)}
.tag{flex:none;border:1.5px solid var(--purple);color:var(--purple);font-weight:600;font-size:18px;border-radius:999px;padding:6px 14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:28px}
.chip-lab{font-size:20px;color:var(--ink-2);margin-right:4px}
.chip{font-size:20px;font-weight:600;color:var(--purple);background:var(--purple-tint);border-radius:999px;padding:8px 14px}
.strict{display:flex;align-items:center;gap:12px;margin:26px 0 0;font-size:22px;color:var(--ink-2)}
.strict b{color:var(--ink);font-weight:600}
.lock{width:28px;height:28px;color:var(--ink);flex:none;display:grid;place-items:center}
.lock svg{width:26px;height:26px}

.mic{width:36px;height:36px;color:var(--ink-3);display:grid;place-items:center}
.mic svg,.vid svg{width:26px;height:26px}
.vid{width:54px;height:54px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;flex:none}


/* Scene 8. Phone call to the recruiter's Twin: connecting, then the talking video with captions. */
.phone{position:relative;width:470px;height:840px;border-radius:34px;overflow:hidden;background:#111216;flex:none;
  box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05)}
.phone-bg{position:absolute;inset:-60px;filter:blur(34px) saturate(.9);opacity:.7}
.phone-bg .cover{width:100% !important;height:100% !important}
.phone-video{position:absolute;inset:0;opacity:0}
.phone-video .video-slot{position:absolute;inset:0}
.phone .missing{background:#2A2B33;color:rgba(255,255,255,.5);font-size:18px}
.phone-shade{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.45))}
.phone-top span{display:block;margin-top:2px;font-size:18px;font-weight:500;color:rgba(255,255,255,.72)}
.phone-top{position:absolute;z-index:4;top:0;left:0;right:0;padding:30px 20px;text-align:center;color:#fff;font-size:26px;font-weight:600;letter-spacing:-.01em}
.phone-ring{position:absolute;z-index:4;left:0;right:0;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:20px}
.ring-wrap{position:relative;width:210px;height:210px;display:grid;place-items:center}
.ring-wrap .avatar{position:relative;z-index:1;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.ring-wrap .avatar.initials{background:#3A3B45;color:#fff}
.pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);opacity:0}
.ring-label{color:rgba(255,255,255,.85);font-size:24px;font-weight:500}
.phone-ctl{position:absolute;z-index:4;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:28px}
.phone-ctl span{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff}
.phone-ctl svg{width:30px;height:30px}
.phone-ctl .m{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.phone-ctl .e{background:#E5484D}
/* Captions live inside the call card, just above the buttons, so they can't spill past its edges. */
.caption{position:absolute;z-index:5;left:20px;right:20px;bottom:128px;padding:12px 18px;border-radius:16px;background:rgba(18,18,24,.68);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:28px;font-weight:500;line-height:1.3;letter-spacing:-.01em;
  text-align:center;text-wrap:balance;opacity:0}
.caption .who{display:block;margin-bottom:4px;font-size:18px;font-weight:600;letter-spacing:.02em;color:#C9B8F0}
.callset{display:flex;align-items:center;gap:80px}
/* Arjun's side of the call: photo, live waveform, word-by-word transcript. */
.caller{width:520px;display:flex;flex-direction:column;gap:24px;color:#F5F3F0}
.caller-h{display:flex;align-items:center;gap:18px}
.caller-h .avatar{transition:box-shadow .2s}
.caller.speaking .caller-h .avatar{box-shadow:0 0 0 4px #1E1F25,0 0 0 7px #8B5CF6}
.caller-nm{font-size:30px;font-weight:600;letter-spacing:-.02em}
.caller-sub{margin-top:2px;font-size:18px;color:rgba(245,243,240,.6)}
.caller canvas{display:block;width:520px;height:72px}
.caller-tx{min-height:132px;font-size:30px;font-weight:500;line-height:1.36;letter-spacing:-.01em}
.caller-tx span{opacity:0}

/* Scene 7. Sarah's call card shrinks into a row of three hiring-team Twins. */
.team{display:flex;flex-direction:column;align-items:center}
.team h2{margin:0 0 44px;font-family:var(--display);font-weight:600;font-size:60px;line-height:1.1;letter-spacing:-.03em;color:#F5F3F0}
.team h2 span{opacity:0}
.team-row{display:flex;gap:48px}
.tcol{width:360px;display:flex;flex-direction:column;align-items:center;gap:22px}
/* Sized so that at 470/360 scale they match the scene 6 call card. */
.tcard{position:relative;width:360px;height:640px;border-radius:26px;overflow:hidden;background:#111216;transform-origin:center;
  box-shadow:0 26px 70px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05)}
.tcard .cover{position:absolute;inset:0;width:100% !important;height:100% !important}
.tcard .missing{background:#2A2B33;color:rgba(255,255,255,.5);font-size:16px}
.tcard-top{position:absolute;z-index:4;top:0;left:0;right:0;padding:23px 16px;text-align:center;color:#fff}
.tcard-top b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
/* 14px here is 18px at hand-off scale (470/360), matching the call card's trust line. */
.tcard-top span{display:block;margin-top:2px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72)}
.tcard .phone-ctl{bottom:28px;gap:22px}
.tcard .phone-ctl span{width:58px;height:58px}
.tcard .phone-ctl svg{width:24px;height:24px}
.tcard .tclip{position:absolute;inset:0}
.tcol-use{font-size:24px;font-weight:500;color:rgba(245,243,240,.84);text-align:center;opacity:0}

.scene.desk{background:var(--canvas)}
/* Scene 1 headline: starts as a centred title, then sits in a band above the inbox (height set from S3.HEAD_H). */
.flood-head{position:absolute;z-index:4;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;transform-origin:center}
.fh-line{position:absolute;margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:64px;line-height:1.1;
  letter-spacing:-.035em;color:var(--ink)}
.fh-line span.row{display:block}
.fh-line .w{opacity:0;color:#9A96A0}
.scene.desk .haze{z-index:0}
.haze.drift{background-size:118% 118%,118% 118%,118% 118%,118% 118%,auto;background-repeat:no-repeat}
.mail-win{position:relative;z-index:1;width:1500px;height:880px;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 .5px rgba(22,20,26,.08),0 28px 70px rgba(22,20,26,.12)}
.mail-title{flex:none;height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#f6f6f6;border-bottom:1px solid #e6e6e6}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.mail-title b{flex:1;text-align:center;font-size:16px;font-weight:600;margin-right:58px;color:#3a3a3a}
.mail-body{flex:1;min-height:0;display:flex}
.mail-side{width:240px;flex:none;background:#f3f2f1;border-right:1px solid #e4e4e4;padding:18px 10px;display:flex;flex-direction:column;gap:4px}
.side-label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8e8e93;padding:12px 12px 4px}
.side-item{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-radius:8px;font-size:18px;color:#1d1d1f}
.side-item.on{background:#d6e6f8;font-weight:600}
.side-count{color:#1d1d1f;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mail-main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.inbox-head{flex:none;display:flex;align-items:center;gap:14px;padding:16px 22px 14px;border-bottom:1px solid #ececec}
.inbox-head h2{margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em}
.inbox-sub{font-size:16px;color:#8e8e93}
.role-chip{font-size:16px;font-weight:600;color:#3a3a3c;background:#f2f2f7;border-radius:999px;padding:5px 12px}
.count-pill{margin-left:auto;background:#e8f1fb;color:#1d4f91;font-weight:700;font-size:18px;border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.inbox-clip{flex:1;min-height:0;overflow:hidden}
.inbox-list{display:flex;flex-direction:column}
.in-row{height:var(--row-h);box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #f0f0f0;background:#fff;flex:none}
.in-row .av,.in-row .avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px;color:var(--ink);flex:none;background:#efeae4}
.in-row .mid{flex:1;min-width:0}
.in-row .sender{display:flex;align-items:center;gap:8px;min-width:0;font-size:24px;font-weight:600;color:#1d1d1f}
.in-row .sender span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-row .preview{margin-top:2px;font-size:20px;color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-row .time{flex:none;width:64px;text-align:right;font-size:16px;color:#8e8e93}
.unread{width:10px;height:10px;border-radius:50%;background:var(--purple);flex:none}
/* Key element. Scenes 8 and 10 use this same purple focus. */
.spotlight{position:relative;z-index:2;background:#efe6fb;transform:translateY(-4px);
  box-shadow:inset 3px 0 0 var(--purple),0 12px 32px rgba(59,26,107,.16)}
.spotlight .sender,.spotlight .preview{font-weight:700;color:#1d1d1f}

/* Scene 6. Stylized job page: LinkedIn blue, no logo, skeleton bars for everything we don't need to read. */
.li-win{position:relative;z-index:1;width:1440px;height:860px;background:#f4f2ee;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 .5px rgba(22,20,26,.08),0 28px 70px rgba(22,20,26,.12)}
.li-chrome{flex:none;height:44px;display:flex;align-items:center;padding:0 18px;background:#f6f6f6;border-bottom:1px solid #e6e6e6}
.li-url{width:520px;height:26px;margin:0 auto;border-radius:8px;background:#ebebeb;display:flex;align-items:center;gap:8px;padding:0 12px;color:#a3a3a3}
.li-url svg{width:13px;height:13px}
.li-nav{flex:none;height:64px;background:#fff;border-bottom:1px solid #e8e6e2;display:flex;align-items:center;gap:14px;padding:0 64px}
.li-mark{width:36px;height:36px;border-radius:8px;background:#dfe3e8}
.li-search{width:300px;height:38px;border-radius:6px;background:#edf3f8}
.li-navs{margin-left:auto;display:flex;gap:34px}
.li-ni{display:flex;flex-direction:column;align-items:center;gap:6px}
.li-ni i{width:24px;height:24px;border-radius:6px;background:#dcd9d4;display:block}
.li-ni b{width:44px;height:8px;border-radius:4px;background:#e6e3de;display:block}
.li-body{flex:1;min-height:0;display:flex;justify-content:center;gap:24px;padding:24px 0}
.li-main{width:900px;display:flex;flex-direction:column;gap:16px}
.li-main > *{flex:none}
.li-side{width:340px;display:flex;flex-direction:column;gap:16px}
.li-card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.li-job{padding:24px 28px}
.li-co{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:rgba(0,0,0,.9)}
.li-co-logo{width:44px;height:44px;border-radius:8px;background:#1f2a44;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px}
.li-title{margin:16px 0 0;font-size:34px;font-weight:600;letter-spacing:-.02em;color:rgba(0,0,0,.9)}
.li-meta{margin-top:8px;font-size:18px;color:rgba(0,0,0,.6)}
.li-meta b{font-weight:600;color:rgba(0,0,0,.9)}
.li-pills{display:flex;gap:10px;margin-top:16px}
.li-pills i{display:block;height:30px;border-radius:999px;background:#edeae6}
.li-acts{display:flex;gap:10px;margin-top:20px}
.li-btn{height:46px;padding:0 24px;border-radius:999px;display:flex;align-items:center;font-size:19px;font-weight:600}
.li-btn.pri{background:#0a66c2;color:#fff}
.li-btn.sec{box-shadow:inset 0 0 0 1.5px #0a66c2;color:#0a66c2}
.li-card h4{margin:0 0 16px;font-size:22px;font-weight:600;color:rgba(0,0,0,.9)}
.li-team{padding:22px 28px 24px;overflow:hidden}
.li-person{display:flex;align-items:center;gap:18px}
.li-pid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.li-name{font-size:20px;font-weight:600;color:rgba(0,0,0,.9)}
.li-name span{margin-left:6px;font-size:17px;font-weight:400;color:rgba(0,0,0,.6)}
.li-line{margin-top:4px;font-size:18px;color:rgba(0,0,0,.9)}
.li-poster{margin-top:4px;font-size:16px;color:rgba(0,0,0,.6)}
.li-msg{flex:none;height:42px;padding:0 20px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.6);color:rgba(0,0,0,.75);
  display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.li-msg svg{width:18px;height:18px}
/* Strikethrough is drawn, not text-decoration, so it can sweep left to right. */
.strike{position:relative;display:inline-flex;align-self:flex-start}
/* Margins live on the wrappers so the strike sits on the text's optical middle. */
.li-team > .strike{margin-bottom:16px}
.li-team h4{margin:0}
.li-pid > .strike + .strike{margin-top:4px}
.li-pid .li-line,.li-pid .li-poster{margin-top:0}
.li-person > .strike{align-self:center}
.strike > .x{position:absolute;left:-4px;right:-4px;top:52%;height:3px;margin-top:-1.5px;border-radius:2px;background:#D93F3F;transform:scaleX(0);transform-origin:left center}
/* The JD is the lift target. The Twin line opens a slot under the heading and pushes the bars down. */
.li-jd{position:relative;z-index:3;padding:24px 28px 26px;transform-origin:center}
.li-jd .sk.sub{height:14px;margin-top:26px;background:#e0ddd8}
.li-bul{display:flex;align-items:center;gap:12px;margin-top:14px}
.li-bul::before{content:'';width:6px;height:6px;border-radius:50%;background:#cfcbc5;flex:none}
.li-side .li-card{padding:20px 22px}
.sk{display:block;height:12px;border-radius:6px;background:#ebe8e4}
.sk + .sk{margin-top:14px}
.li-peer{display:flex;align-items:center;gap:12px}
.li-peer + .li-peer{margin-top:16px}
.li-peer i{width:40px;height:40px;border-radius:50%;background:#e6e3de;flex:none;display:block}
.li-peer div{flex:1}
.li-peer .sk + .sk{margin-top:8px}
.li-dim{position:absolute;inset:0;z-index:2;background:rgba(245,243,240,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none}
.twin-line{position:relative;height:0;margin-bottom:0;display:flex;align-items:center;gap:16px;padding:0 16px 0 24px;background:#fff;border-radius:16px;
  box-shadow:inset 0 0 0 1.5px var(--purple),0 14px 36px rgba(59,26,107,.14);opacity:0;overflow:hidden}
.twin-line .txt{flex:1;min-width:0;font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.twin-link{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:22px;font-weight:600;color:var(--purple-2);
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;transition:color .18s,background-color .18s}
.twin-link svg{width:18px;height:18px}
.twin-link.hover{color:var(--purple);background:var(--purple-tint);text-decoration-thickness:2.5px}
.twin-link.pressed{background:#E2D6F5}

/* Scene 8. Round 1 with Daniel as a live transcript: who's speaking, waveform, words as said. */
/* Nudged above centre so the headline has air above it and a clear gap to the transcript. */
.round{width:1100px;display:flex;flex-direction:column;gap:22px;margin-top:-70px}
/* Same headline style as scene 1, in light ink for the dark call scenes. */
.round-head{align-self:center;margin:0 0 84px;text-align:center;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:64px;line-height:1.1;
  letter-spacing:-.035em;color:#F5F3F0}

/* Copy can mark a phrase with *asterisks*; those words get the .hl highlight. Returns [{ word, hl }]. */
function marked(textValue){
  let on = false;
  return textValue.split(' ').map(raw => {
    const starts = raw.startsWith('*'), ends = raw.endsWith('*') || raw.endsWith('*.') || raw.endsWith('*?');
    if (starts) on = true;
    const item = { word: raw.replace(/\*/g, ''), hl: on };
    if (ends) on = false;
    return item;
  });
}
function node(tag, className){ const n = document.createElement(tag); if (className) n.className = className; return n; }
function icon(html){ const s = node('span', 'ico'); s.innerHTML = html; return s; }
function words(text){
  const frag = document.createDocumentFragment();
  text.split(' ').forEach((word, i) => {
    if (i) frag.append(document.createTextNode(' '));
    const s = node('span', 'w');
    s.textContent = word;
    frag.append(s);
  });
  return frag;
}
function placeholder(label, w, h){
  const d = node('div', 'missing');
  d.style.width = w + 'px'; d.style.height = h + 'px';
  d.textContent = label;
  return d;
}
function initialsOf(label){
  const clean = String(label || '').replace(/\.[a-z0-9]+$/i, '').replace(/[_-]+/g, ' ').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return (parts[0] || '?').slice(0, 2).toUpperCase();
}
function portrait(src, label, size, initials){
  const wrap = node('div', 'avatar');
  wrap.style.width = wrap.style.height = size + 'px';
  const img = new Image();
  img.alt = label;
  img.addEventListener('error', () => {
    img.remove();
    wrap.replaceChildren();
    if (initials){
      wrap.classList.add('initials');
      wrap.textContent = initialsOf(label);
      wrap.style.fontSize = Math.round(size * 0.34) + 'px';
    } else {
      wrap.classList.add('missing');
      const dot = label.lastIndexOf('.');
      if (dot > 0) wrap.append(document.createTextNode(label.slice(0, dot)), document.createElement('br'), document.createTextNode(label.slice(dot)));
      else wrap.textContent = label;
      wrap.style.fontSize = Math.max(11, Math.round(size / 8)) + 'px';
    }
  });
  img.src = src;
  wrap.append(img);
  return wrap;
}
function cover(src, label, w, h){
  const wrap = node('div', 'cover');
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  const img = new Image();
  img.alt = label;
  img.addEventListener('error', () => { wrap.replaceChildren(placeholder(label, w, h)); });
  img.src = src;
  wrap.append(img);
  return wrap;
}
function videoBox(src, label){
  const wrap = node('div', 'video-slot');
  const v = document.createElement('video');
  v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', '');
  v.addEventListener('error', () => {
    const ph = placeholder(label, 10, 10);
    ph.style.width = '100%'; ph.style.height = '100%';
    wrap.replaceChildren(ph);
  });
  v.src = src;
  wrap.append(v);
  return wrap;
}
function logo(){
  const img = new Image();
  img.className = 'logo'; img.alt = 'TwinCafe';
  img.addEventListener('error', () => img.replaceWith(placeholder('twincafe-logo.svg', 420, 84)));

  return img;
}

/* TitleCard words start visible (the key frame). TitleCard.reveal is the P1 pass for later. */
function TitleCard(line1, line2){
  const root = node('div', 'titlecard ready');
  root.append(node('div', 'haze'));
  const frame = node('div', 'frame');
  const a = node('p', 't1'); a.append(words(line1)); frame.append(a);
  if (line2){ const b = node('p', 't2'); b.append(words(line2)); frame.append(b); }
  root.append(frame);
  return root;
}

  const haze = card.querySelector('.haze');
  const total = line1.length + line2.length;
  const swallow = err => { if (err !== CANCEL && err?.name !== 'AbortError') console.error(err); };
  card.classList.remove('ready');
  [...line1, ...line2].forEach(w => { w.style.opacity = '0'; w.style.color = '#9A96A0'; });
  if (haze) haze.style.opacity = '0.06';
  const hazeTo = (seen) => {
    const v = seen >= total ? 1 : 0.06 + 0.6 * Math.pow(seen / total, 1.5);
    if (!haze) return;
    t.animate(haze, [{ opacity: haze.style.opacity || 0.06 }, { opacity: v }], { duration: 180, easing: EASE_OUT, fill: 'forwards' }).catch(swallow);
  };
  async function revealLine(list, stagger, payoff){
    for (let i = 0; i < list.length; i++){
      if (i > 0) await t(stagger);
      if (payoff && i === list.length - 1) await t(P1_PAYOFF_EXTRA_MS);
      const w = list[i];
      t.animate(w, [
        { opacity: 0, color: '#9A96A0' },
        { opacity: 0.4, color: '#9A96A0', offset: 0.4 },
        { opacity: 1, color: '#16141A' }
      ], { duration: 170, easing: 'ease-out', fill: 'forwards' }).catch(swallow);
      hazeTo(line1.indexOf(w) >= 0 ? i + 1 : line1.length + i + 1);
    }
    await t(P1_WORD_REVEAL_MS);
  }
  await revealLine(line1, P1_WORD_STAGGER_MS, line2.length === 0);
  if (line2.length){
    await t(P1_LINE_GAP_MS);
    await revealLine(line2, P1_LINE2_STAGGER_MS, true);
  }
  await t(P1_POST_REVEAL_HOLD_MS);
}
function titleMs(a, b = 0){
  const line1 = Math.max(0, a - 1) * P1_WORD_STAGGER_MS + P1_WORD_REVEAL_MS + (b ? 0 : P1_PAYOFF_EXTRA_MS);
  if (!b) return line1 + P1_POST_REVEAL_HOLD_MS;
  const line2 = Math.max(0, b - 1) * P1_LINE2_STAGGER_MS + P1_PAYOFF_EXTRA_MS + P1_WORD_REVEAL_MS;
  return line1 + P1_LINE_GAP_MS + line2 + P1_POST_REVEAL_HOLD_MS;
}

/* Scrolling bar waveform. level() returns 0..1; a new bar enters every BAR_MS of clock time. */
function Waveform(canvas, level){
  const BARS = 52, BAR_MS = 60, ctx = canvas.getContext('2d');
  const bars = new Array(BARS).fill(0);
  let last = 0, peak = 0;
  return function draw(elapsed){
    peak = Math.max(peak, level());
    if (elapsed - last >= BAR_MS){ bars.shift(); bars.push(peak); peak = 0; last = elapsed; }
    const w = canvas.width, h = canvas.height, step = w / BARS, bw = step * 0.5;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#C9B8F0';
    bars.forEach((v, i) => {
      const bh = Math.max(6, v * h * 0.95);
      const x = i * step + (step - bw) / 2, y = (h - bh) / 2;
      ctx.globalAlpha = 0.35 + 0.65 * (i / BARS);
      ctx.beginPath(); ctx.roundRect(x, y, bw, bh, bw / 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  };
}

/* Schedules a speaker's words from now (evenly through the spoken part of each line) and returns
   the total time plus a stand-in waveform level that's up only while they're talking. */
function speakWords(t, words, lines, swallow){
  const start = clock.elapsed, windows = [];
  let off = 0, w = 0;
  lines.forEach(line => {
    const n = marked(line.text).length, talk = line.ms * S8.TALK;
    windows.push([off, off + talk]);
    for (let k = 0; k < n; k++, w++){
      t.animate(words[w], [{ opacity: 0 }, { opacity: 1 }],
        { duration: S8.WORD_IN, delay: off + (k * talk) / n, easing: EASE_OUT }).catch(swallow);
    }
    off += line.ms;
  });
  const level = () => {
    const e = clock.elapsed - start;
    if (!windows.some(([a, b]) => e >= a && e < b)) return 0.02;
    return 0.22 + 0.5 * Math.abs(Math.sin(e / 47) * Math.sin(e / 113 + 1.3));
  };
  return { total: off, level };
}
/* Seeded so every take bursts the same way. */
function rng(seed){
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}
const CONFETTI_COLORS = ['#8B5CF6', '#C4B5FD', '#EC4899', '#FBBF24', '#2DD4BF', '#6E35C9'];
/* One burst of confetti from (x, y) in stage px, aimed at `dir` degrees (0 = right, -90 = up).
   Each piece flies with drag and gravity, spins, and fades out near the end. */
function burstConfetti(t, layer, { x, y, dir, spread, count, speed, seed }, swallow){
  const rand = rng(seed);
  const DRAG = 1.7, GRAVITY = 1500, STEPS = 12;
  for (let i = 0; i < count; i++){
    const piece = node('i', 'cf');
    const round = rand() < .3;
    const w = round ? 9 + rand() * 5 : 8 + rand() * 9, h = round ? w : 5 + rand() * 5;
    piece.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;` +
      `background:${CONFETTI_COLORS[Math.floor(rand() * CONFETTI_COLORS.length)]};border-radius:${round ? '50%' : '2px'};opacity:0`;
    layer.append(piece);
    const a = (dir + (rand() - .5) * spread) * Math.PI / 180;
    const v = speed * (.55 + rand() * .6);
    const vx = Math.cos(a) * v, vy = Math.sin(a) * v;
    const spin = (rand() - .5) * 1440, dur = 1500 + rand() * 700;
    const frames = [];
    for (let k = 0; k <= STEPS; k++){
      const u = k / STEPS, tt = u * dur / 1000, drag = (1 - Math.exp(-DRAG * tt)) / DRAG;
      frames.push({
        transform: `translate(${vx * drag}px, ${vy * drag + .5 * GRAVITY * tt * tt * .45}px) rotate(${spin * tt}deg) scale(${k ? 1 : .4})`,
        opacity: u < .72 ? 1 : 1 - (u - .72) / .28
      });
    }
    t.animate(piece, frames, { duration: dur, delay: rand() * 90, easing: 'linear' })
      .then(() => piece.remove()).catch(swallow);
  }
}

  show(){ this.el.style.opacity = '1'; },
  /* hide() also drops held opacity/move animations so the next scene starts clean. */
  hide(){ this.el.getAnimations().forEach(a => a.cancel()); this.el.style.opacity = '0'; this.pointer(false); },
  /* Pointing hand over links, arrow everywhere else. */
  pointer(on){ this.el.classList.toggle('pointer', on); this.svg = on ? this.hand : this.arrow; },
  async move(t, x, y, ms = 720){
    const x0 = this.x, y0 = this.y;
    const dist = Math.hypot(x - x0, y - y0);
    const frames = [];
    if (dist > 1920 / 3){
      const bow = -0.12;
      const qx = (x0 + x) / 2 - (y - y0) * bow;
      const qy = (y0 + y) / 2 + (x - x0) * bow;
      for (let i = 0; i <= 24; i++){
        const u = i / 24, a = (1 - u) * (1 - u), m = 2 * u * (1 - u), c = u * u;
        frames.push({ transform: `translate(${a * x0 + m * qx + c * x}px, ${a * y0 + m * qy + c * y}px)` });
      }
    } else {
      frames.push({ transform: `translate(${x0}px, ${y0}px)` }, { transform: `translate(${x}px, ${y}px)` });
    }
    await t(STAGGER_MS);
    await t.animate(this.el, frames, { duration: ms, easing: 'cubic-bezier(.45,0,.2,1)' });
    this.place(x, y);
  },
  /* Press and ripple overlap: 80ms in, the ring starts; 600ms total. */
  async click(t){
    const press = t.animate(this.svg, [
      { transform: 'scale(1)' }, { transform: 'scale(.8)', offset: .35 }, { transform: 'scale(1)' }
    ], { duration: 240, easing: EASE_OUT });
    await t(80);
    const rip = node('div', 'ripple');
    rip.style.left = this.x + 'px'; rip.style.top = this.y + 'px';
    this.el.parentElement.append(rip);
    const ring = t.animate(rip, [
      { opacity: .65, transform: 'translate(-50%, -50%) scale(.3)' },
      { opacity: 0, transform: 'translate(-50%, -50%) scale(1.5)' }
    ], { duration: 520, easing: EASE_OUT });
    await Promise.all([press, ring]);
    rip.remove();
  }
};

class Clock {
  constructor(){
    this.paused = true; this.dead = false; this.elapsed = 0; this.last = 0;
    this.waiters = []; this.anims = new Set(); this.videos = new Set(); this.raf = 0;
  }
  start(){ this.dead = false; this.paused = false; this.last = performance.now(); grainAnim.play(); this.loop(); }
  loop = () => {
    if (this.paused || this.dead) return;
    const now = performance.now();
    this.elapsed += now - this.last; this.last = now;
    this.flush();
    this.raf = requestAnimationFrame(this.loop);
  };
  flush(){
    const due = this.waiters.filter(w => w.at <= this.elapsed);
    this.waiters = this.waiters.filter(w => w.at > this.elapsed);
    due.forEach(w => w.resolve());
  }
  wait(ms){
    if (this.dead) return Promise.reject(CANCEL);
    if (ms <= 0) return Promise.resolve();
    return new Promise((resolve, reject) => { this.waiters.push({ at: this.elapsed + ms, resolve, reject }); });
  }
  animate(el, frames, opts = {}){
    if (this.dead) return Promise.reject(CANCEL);
    const anim = el.animate(frames, { fill: 'forwards', ...opts });
    this.anims.add(anim);
    const done = anim.finished.then(() => { this.anims.delete(anim); }).catch(err => {
      this.anims.delete(anim); throw (this.dead ? CANCEL : err);
    });
    if (this.paused) anim.pause();
    return done;
  }
  /* Any media element: videos and Arjun's question audio pause and resume with the clock. */
  trackVideo(v){
    if (!(v instanceof HTMLMediaElement)) return;
    this.videos.add(v);
    if (this.paused || this.dead) v.pause();
    else v.play().catch(() => {});
  }
  pause(){
    if (this.paused || this.dead) return;
    const now = performance.now();
    this.elapsed += now - this.last; this.last = now;
    this.paused = true;
    cancelAnimationFrame(this.raf);
    this.anims.forEach(holdAnim);
    holdAnim(grainAnim);
    this.videos.forEach(v => { try { v.pause(); } catch (e) {} });
  }
  resume(){
    if (!this.paused || this.dead) return;
    this.paused = false; this.last = performance.now();
    this.anims.forEach(a => { try { a.play(); } catch (e) {} });
    grainAnim.play();
    this.videos.forEach(v => { try { v.play().catch(() => {}); } catch (e) {} });
    this.loop();
  }
  cancel(){
    this.dead = true; this.paused = true;
    cancelAnimationFrame(this.raf);
    const pending = this.waiters; this.waiters = [];
    pending.forEach(w => w.reject(CANCEL));
    this.anims.forEach(a => { try { a.cancel(); } catch (e) {} });
    this.anims.clear();
    holdAnim(grainAnim);
    this.videos.forEach(v => { try { v.pause(); } catch (e) {} });
    this.videos.clear();
  }
}

function blank(scene){
  scene.el.getAnimations().forEach(a => a.cancel());
  scene.el.innerHTML = '';
  scene.el.classList.toggle('dark', !!scene.dark);
  scene.el.style.opacity = '1';
  Cursor.hide();

}
async function playHold(scene, t){
  const fade = Math.min(FADE_IN_MS, scene.plannedMs);
  scene.el.style.opacity = '0';
  scene.el.querySelectorAll('video').forEach(v => t.trackVideo(v));
  await t.animate(scene.el, [{ opacity: 0 }, { opacity: 1 }], { duration: fade, easing: EASE_OUT });
  scene.el.style.opacity = '1';
  await t(scene.plannedMs - fade);
}
async function exitEl(el, t){
  const out = [{ opacity: 1 }, { opacity: 0 }];
  const fades = [t.animate(el, out, { duration: SCENE_EXIT_MS, easing: EASE_IN })];
  if (Cursor.el.style.opacity === '1') fades.push(t.animate(Cursor.el, out, { duration: SCENE_EXIT_MS, easing: EASE_IN }));
  await Promise.all(fades);
  el.style.opacity = '0';
  Cursor.hide();
}

function fmt(ms){
  const safe = Math.max(0, ms);
  const m = Math.floor(safe / 60000);
  const s = (safe % 60000) / 1000;
  return m + ':' + s.toFixed(1).padStart(4, '0');
}
function times(){
  if (state === 'ready' || !clock) return { scene: 0, film: filmBase(index) };
  const scene = Math.min(clock.elapsed, SCENES[index].plannedMs);
  return { scene, film: filmBase(index) + scene };
}
function paint(){
  const scene = SCENES[index];
  const t = times();
  document.getElementById('p-scene').textContent = 'Scene ' + (index + 1) + '/' + SCENES.length;
  document.getElementById('p-name').textContent = scene.name;
  document.getElementById('p-state').textContent = STATE_LABEL[state] + ' · ' + (mode === 'film' ? 'Film' : 'Scene') + ' mode';
  document.getElementById('p-time').textContent = 'Scene ' + fmt(t.scene) + ' / ' + fmt(scene.plannedMs) + '    Film ' + fmt(t.film) + ' / ' + fmt(TOTAL_MS);
  document.getElementById('panel').classList.toggle('hide', panelHidden || state === 'playing');
}
function bindClock(c){
  const t = ms => c.wait(ms);
  t.animate = (el, frames, opts) => c.animate(el, frames, opts);
  t.trackVideo = v => c.trackVideo(v);
  return t;
}
function hideOthers(i){
  SCENES.forEach((scene, n) => {
    if (n === i) return;
    scene.el.getAnimations().forEach(a => a.cancel());
    scene.el.innerHTML = '';
    scene.el.classList.remove('on');
    scene.el.style.opacity = '0';
  });
}
function selectScene(i){
  if (i < 0 || i >= SCENES.length) return;
  token++;
  if (clock){ clock.cancel(); clock = null; }
  state = 'ready'; index = i;
  hideOthers(i);
  const scene = SCENES[i];
  scene.el.classList.add('on');
  scene.build();
  paint();
}
async function play(from, playMode){
  const my = ++token;
  if (clock){ clock.cancel(); clock = null; }
  mode = playMode;
  state = 'playing';
  const last = mode === 'scene' ? from : SCENES.length - 1;
  for (let i = from; i <= last; i++){
    if (token !== my) return;
    index = i;
    const scene = SCENES[i];
    hideOthers(i);
    scene.el.classList.add('on');
    scene.build();
    clock = new Clock();
    const t = bindClock(clock);
    clock.start();
    paint();
    try {
      await scene.play(t);
      if (token !== my) return;
      if (i < last && !scene.handoff) await exitEl(scene.el, t);
    } catch (err){
      if (token !== my || err === CANCEL) return;
      console.error(err);
      return;
    }
    if (token !== my) return;
    if (clock) clock.pause();
  }
  if (token !== my) return;
  state = 'done';
  paint();
}
function togglePause(){
  if (state === 'playing'){ state = 'paused'; if (clock) clock.pause(); }
  else if (state === 'paused'){ state = 'playing'; if (clock) clock.resume(); }
  paint();
}
function onSpace(){
  if (state === 'playing' || state === 'paused') togglePause();
  else play(index, 'film');
}
function onEnter(){
  if (state === 'paused' && mode === 'scene') togglePause();
  else play(index, 'scene');
}
function uiTick(){
  if (state === 'playing' || state === 'paused') paint();
  requestAnimationFrame(uiTick);
}
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = SCENE_KEYS.indexOf(e.code);
  if (n >= 0){ e.preventDefault(); selectScene(n); return; }
  switch (e.code){
    case 'ArrowLeft': e.preventDefault(); selectScene(index - 1); break;
    case 'ArrowRight': e.preventDefault(); selectScene(index + 1); break;
    case 'Space': e.preventDefault(); onSpace(); break;
    case 'Enter': case 'NumpadEnter': e.preventDefault(); onEnter(); break;
    case 'KeyR': e.preventDefault(); play(index, mode); break;
    case 'Escape': e.preventDefault(); selectScene(index); break;
    case 'KeyH': e.preventDefault(); panelHidden = !panelHidden; paint(); break;
  }
});
selectScene(0);
requestAnimationFrame(uiTick);
</script>
