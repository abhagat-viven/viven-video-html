<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tacit Knowledge — Full Diagram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #f5f3f0;
  --bg-surface: #ffffff;
  --text-tertiary: #9a9a9a;
  --arrow-color: #4a5568;
  --font-main: 'DM Sans', -apple-system, sans-serif;
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-deep);
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
}
.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.ambient-bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(161,150,235,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 20% 80%, rgba(59,111,160,0.02) 0%, transparent 60%),
    var(--bg-deep);
  z-index: 0;
}
.scene-wrap {
  position: relative;
  width: 880px; height: 400px;
  z-index: 2;
  animation: el-drift 10s ease-in-out infinite;
}
@keyframes el-drift {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.head-img { opacity: 0; transition: opacity 0.8s ease; }
.head-img.visible { opacity: 1; }
.diamond-shape { opacity: 0; transition: opacity 0.6s ease; }
.diamond-shape.visible { opacity: 1; }
.knot-logo { opacity: 0; transition: opacity 0.8s ease; }
.knot-logo.visible { opacity: 1; }
.brain-dot, .green-dot, .blue-dot, .grad-dot { fill: #ffffff; opacity: 0; }
.arrow-path {
  fill: none; stroke: var(--arrow-color); stroke-width: 1.8;
  stroke-linecap: round; opacity: 0;
}
.arrow-path.drawing { opacity: 1; }
.arrow-head { fill: var(--arrow-color); opacity: 0; transition: opacity 0.3s ease; }
.arrow-head.visible { opacity: 1; }
.scene-indicator {
  position: fixed; bottom: 16px; right: 16px;
  background: var(--bg-surface); border: 1px solid rgba(0,0,0,0.10);
  border-radius: 8px; padding: 8px 14px;
  font-size: 12px; color: var(--text-tertiary); z-index: 100;
  font-family: 'JetBrains Mono', monospace;
}
.scene-indicator kbd {
  background: #faf9f7; border: 1px solid rgba(0,0,0,0.06);
  padding: 1px 5px; border-radius: 4px; font-size: 11px;
}
/* Labels below each element */
.label-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  fill: var(--text-primary);
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.label-title.visible { opacity: 1; }
.label-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 9.5px;
  font-weight: 400;
  fill: var(--text-tertiary);
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.8s ease 0.2s;
}
.label-sub.visible { opacity: 1; }
</style>
</head>
<body>
<div class="ambient-bg"></div>
<div class="stage">
  <div class="scene-wrap">

          <stop offset="45%" stop-color="#0d7b94"/>
          <stop offset="100%" stop-color="#37b34a"/>
        </linearGradient>

const headDotEls = document.querySelectorAll('.brain-dot');
const greenDotEls = document.querySelectorAll('.green-dot');
const blueDotEls = document.querySelectorAll('.blue-dot');
const gradDotEls = document.querySelectorAll('.grad-dot');

function xNorms(data) {
  const xs = data.map(d => d.x);
  const mn = Math.min(...xs), mx = Math.max(...xs);
  return data.map(d => (d.x - mn) / (mx - mn || 1));
}
const headXN = xNorms(HEAD_DATA);
const greenXN = xNorms(GREEN_DATA);
const blueXN = xNorms(BLUE_DATA);
const gradXN = xNorms(GRAD_DATA);

const DIM = 0.4, BRIGHT = 1.0;

function drawArrow(pathEl, headEl, duration, onDone) {
  const len = pathEl.getTotalLength();
  pathEl.style.strokeDasharray = len;
  pathEl.style.strokeDashoffset = len;
  pathEl.classList.add('drawing');
  const endPt = pathEl.getPointAtLength(len);
  const nearEnd = pathEl.getPointAtLength(len - 2);
  const angle = Math.atan2(endPt.y - nearEnd.y, endPt.x - nearEnd.x) * 180 / Math.PI;
  headEl.setAttribute('transform', `translate(${endPt.x},${endPt.y}) rotate(${angle})`);
  pathEl.style.transition = `stroke-dashoffset ${duration}ms ease-in-out`;
  requestAnimationFrame(() => { pathEl.style.strokeDashoffset = '0'; });
  st(() => { headEl.classList.add('visible'); if (onDone) onDone(); }, duration);
}

function fadeInDots(dotEls, data, duration, onDone) {
  const sorted = data.map((d, i) => ({ i, x: d.x })).sort((a, b) => a.x - b.x);
  const stagger = duration / sorted.length;
  sorted.forEach((entry, rank) => {
    st(() => {
      dotEls[entry.i].style.transition = 'opacity 0.4s ease';
      dotEls[entry.i].style.opacity = DIM.toString();
    }, rank * stagger);
  });
  st(() => { if (onDone) onDone(); }, duration + 400);
}

function startSweep(dotEls, xNormArr) {
  const SWEEP_DUR = 2400, BEAM_W = 0.35, PAUSE = 600;
  const CYCLE = SWEEP_DUR + PAUSE;
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const elapsed = (ts - start) % CYCLE;
    const progress = elapsed / SWEEP_DUR;
    dotEls.forEach((dot, i) => {
      const xPos = xNormArr[i];
      let b;
      if (progress > 1) { b = DIM; }
      else {
        const center = progress * (1 + BEAM_W) - BEAM_W / 2;
        const dist = Math.abs(xPos - center);
        if (dist < BEAM_W / 2) {
          const t = 1 - dist / (BEAM_W / 2);
          b = DIM + (BRIGHT - DIM) * t * t * (3 - 2 * t);
        } else { b = DIM; }
      }
      dot.style.opacity = b.toFixed(3);
    });
    const id = requestAnimationFrame(tick);
    rafIds.push(id);
  }
  const id = requestAnimationFrame(tick);
  rafIds.push(id);
}

function showLabel(num) {
  document.querySelectorAll(`[id^="lbl${num}"]`).forEach(el => el.classList.add('visible'));
}
function hideAllLabels() {
  document.querySelectorAll('[class*="label-"]').forEach(el => el.classList.remove('visible'));
}

function reset() {
  clearT();
  $('headImg').classList.remove('visible');
  $('greenDiamond').classList.remove('visible');
  $('blueDiamond').classList.remove('visible');
  $('gradDiamond').classList.remove('visible');
  $('vivenKnot').classList.remove('visible');
  for (let i = 1; i <= 4; i++) {
    const p = $('arrow' + i); p.classList.remove('drawing');
    p.style.strokeDashoffset = ''; p.style.strokeDasharray = ''; p.style.transition = '';
    $('arrowHead' + i).classList.remove('visible');
  }
  [headDotEls, greenDotEls, blueDotEls, gradDotEls].forEach(els => {
    els.forEach(d => { d.style.opacity = '0'; d.style.transition = ''; });
  });
  hideAllLabels();
}

function play() {
  reset();

  // Phase 1: Head + brain dots + sweep + label
  st(() => $('headImg').classList.add('visible'), 200);
  st(() => showLabel(1), 400);
  st(() => fadeInDots(headDotEls, HEAD_DATA, 3500), 800);
  st(() => startSweep(headDotEls, headXN), 5000);

  // Phase 2: Curved arrows
  st(() => {
    drawArrow($('arrow1'), $('arrowHead1'), 700);
    drawArrow($('arrow2'), $('arrowHead2'), 600);
  }, 6000);

  // Phase 3: Both diamonds + dots + labels simultaneously
  st(() => {
    $('greenDiamond').classList.add('visible');
    $('blueDiamond').classList.add('visible');
    showLabel(2);
    showLabel(3);
  }, 7200);
  st(() => {
    fadeInDots(greenDotEls, GREEN_DATA, 2500);
    fadeInDots(blueDotEls, BLUE_DATA, 3500);
  }, 7600);
  st(() => {
    startSweep(greenDotEls, greenXN);
    startSweep(blueDotEls, blueXN);
  }, 10600);

  // Phase 4: Arrow → knot + label
  st(() => drawArrow($('arrow3'), $('arrowHead3'), 500), 11500);
  st(() => {
    $('vivenKnot').classList.add('visible');
    showLabel(4);
  }, 12200);

  // Phase 5: Arrow → gradient diamond + dots + label
  st(() => drawArrow($('arrow4'), $('arrowHead4'), 500), 13200);
  st(() => {
    $('gradDiamond').classList.add('visible');
    showLabel(5);
  }, 13900);
  st(() => fadeInDots(gradDotEls, GRAD_DATA, 3500), 14300);
  st(() => startSweep(gradDotEls, gradXN), 18300);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); play(); }
  if (e.key === 'r' || e.key === 'R') reset();
});
st(play, 500);
