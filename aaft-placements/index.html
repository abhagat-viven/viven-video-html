<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAFT Placements Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AAFT Placements Space — 2:00 film for Screen Studio (16:9, 1920×1080)
   Voices play from this page (narrator + interview); music is added in Canva.
   Controls: Space start · P pause · R restart · 1–8 jump · H hide hints/debug
   URL: ?bars=black|white|ground · ?debug=1 · ?flash=0 · ?t=SECONDS · #scene-N
   ===================================================================== */
:root{
  --g-base:#F6E6E0; --g-peach:#EC9A64; --g-pink:#EE93B6; --g-peri:#A6A3EA; --g-rose:#F2A6BC;
  --ground: radial-gradient(62% 70% at 0% 0%, var(--g-peach) 0%, rgba(236,154,100,0) 72%),
            radial-gradient(42% 62% at 100% 42%, var(--g-pink) 0%, rgba(238,147,182,0) 72%),
            radial-gradient(58% 62% at 100% 100%, var(--g-peri) 0%, rgba(166,163,234,0) 76%),
            radial-gradient(46% 56% at 0% 100%, var(--g-rose) 0%, rgba(242,166,188,0) 72%),
            var(--g-base);
  --ink:#16141A; --accent:#E44D86;
  --ui-ink:#111827; --ui-ink-2:#4B5563; --ui-ink-3:#9CA3AF; --ui-line:#E7E7EA; --ui-chip:rgba(15,23,42,.05);
  --plum:#3B0964;
  --f-head:'Instrument Serif',Georgia,serif; --f-ui:'Geist',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
body.bars-white{background:#fff}
body.bars-ground{background:var(--ground)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
       font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--g-base)}
.ground{position:absolute;inset:0;background:var(--ground)}
#world{position:absolute;inset:0}
.abs{position:absolute}

/* type */
.head{position:absolute;left:0;right:0;top:78px;height:90px;text-align:center;font:400 76px/1 var(--f-head);z-index:20}
.head .h{position:absolute;left:0;right:0;top:0}
em,.em{font-style:italic;color:var(--accent)}
.w{display:inline-block;opacity:0}
.big{font:400 92px/1.08 var(--f-head)}
.logo-tr{position:absolute;right:64px;top:42px;width:206px;opacity:0;z-index:30}

/* AAFT Space tile (shared element: 1B → 2 → 8) */
.tile{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:30px;
      background:#fff url(assets/aaft-logo.jpg) center/84% no-repeat;box-shadow:0 16px 40px rgba(80,30,80,.16);opacity:0;z-index:12}
.tile .bdg{position:absolute;right:-10px;bottom:-10px;width:44px;height:44px;border-radius:50%;background:var(--plum);   /* bottom-right, as on the Twin's avatar */
           display:flex;align-items:center;justify-content:center;border:3px solid #fff}

/* scene 2 Space card */
.s2card{position:absolute;left:480px;top:250px;width:960px;height:620px;border-radius:32px;background:rgba(255,255,255,.9);
        box-shadow:0 30px 80px rgba(80,30,80,.12);opacity:0;z-index:5}
.s2mem{position:absolute;left:52px;top:34px;display:flex;align-items:center}
.s2mem img{width:46px;height:46px;border-radius:50%;object-fit:cover;margin-left:-12px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.08);opacity:0}
.s2mem span{font-size:18px;color:#6B7280;margin-left:14px;opacity:0}
.doc{position:absolute;width:230px;background:#fff;border:1px solid var(--ui-line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.03);opacity:0;color:var(--ui-ink)}
.doc b{display:block;font-size:19px;font-weight:600;margin-top:10px}.doc span{font-size:14px;color:var(--ui-ink-3)}
.twincap{position:absolute;left:405px;top:385px;width:150px;text-align:center;font-size:17px;font-weight:600;color:var(--ui-ink);opacity:0}
.agent{position:absolute;left:640px;top:480px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ui-line);border-radius:16px;padding:16px 20px;box-shadow:0 12px 30px rgba(0,0,0,.08);opacity:0;color:var(--ui-ink)}
.agent img{width:48px;height:48px;border-radius:50%}
.agent b{display:block;font-size:19px;font-weight:600}.agent span{font-size:14px;color:#6B7280}
.s2lines path{fill:none;stroke:#C9B6E4;stroke-width:2.5;stroke-linecap:round}

/* browser window (persistent from 0:18 to 1:52) */
.bw{position:absolute;left:210px;top:186px;width:1500px;height:780px;border-radius:18px;background:#fff;
    box-shadow:0 2px 8px rgba(60,20,60,.06),0 40px 90px rgba(80,30,80,.16);overflow:hidden;opacity:0;z-index:8}
.bw-bar{height:46px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #EFEDEB}
.bw-bar .dots{position:absolute;left:20px;top:17px;display:flex;gap:8px}.bw-bar .dots i{width:12px;height:12px;border-radius:50%}
.bw-bar .url{font:500 14px var(--f-ui);color:#3f3a44;background:#F3F1EE;border-radius:8px;padding:5px 82px}
.bw-body{position:absolute;left:0;right:0;top:46px;bottom:0;overflow:hidden}
/* scene 1 + 8 */
.s1a{position:absolute;left:300px;top:400px;z-index:10}
.s1lab{position:absolute;left:0;right:0;top:575px;text-align:center;font:400 40px var(--f-head);opacity:0;z-index:10}
.s1on{position:absolute;left:0;right:0;top:680px;text-align:center;opacity:0;z-index:10;font:500 22px var(--f-ui);color:#3f3a44}
.s1on img{width:170px;vertical-align:middle;margin-left:10px}
.s8l1{position:absolute;left:0;right:0;top:494px;text-align:center;font:400 56px var(--f-head);z-index:10}
.s8l2{position:absolute;left:0;right:0;top:618px;text-align:center;font:400 68px var(--f-head);z-index:10}
.disc{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:500 18px var(--f-ui);color:rgba(22,20,26,.55);opacity:0;z-index:10}

/* ---------- product UI inside the window (native px, enlarged 1.32× like the storyboard) ---------- */
.app{position:absolute;inset:0;zoom:1.32;font-family:var(--f-ui);color:var(--ui-ink);background:#fff}
.sp-top{position:relative;z-index:3;background:#fff;height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--ui-line)}
.sp-top .back{color:var(--ui-ink-2);display:flex}
.sav{position:relative;width:36px;height:36px;flex:none;border-radius:8px;background:#fff url(assets/aaft-logo.jpg) center/84% no-repeat;box-shadow:0 0 0 1px var(--ui-line)}
.sav .bdg{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--plum);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.sp-top .nm b{display:block;font-size:14px;font-weight:600}.sp-top .nm span{font-size:12px;color:var(--ui-ink-3)}
.agbtn{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--ui-line);font-size:14px;font-weight:600;position:relative;background:#fff}
.agbtn .dot{position:absolute;right:6px;top:2px;width:7px;height:7px;border-radius:50%;background:#F59E0B}
.agbtn.on{background:#F3F1F6}
.more{width:36px;height:36px;border-radius:50%;border:1px solid var(--ui-line);display:flex;align-items:center;justify-content:center;color:var(--ui-ink-2)}
.tv{position:absolute;left:0;right:0;top:64px;bottom:104px;overflow:hidden}
.tc{width:680px;margin:0 auto;padding:22px 0 10px}
.msg{margin-bottom:22px}
.other{display:flex;gap:12px;align-items:flex-start}
.other img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.other .nm{font-size:14px;font-weight:600;margin:6px 0 6px}
.bub{display:inline-block;background:var(--ui-chip);border-radius:22px;padding:10px 16px;font-size:14px;line-height:22px;max-width:480px}
.bub .t{font-size:11px;color:var(--ui-ink-3);margin-left:8px}
.mine{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.mine .t{font-size:11px;color:var(--ui-ink-3)}
.mention{background:rgba(59,9,100,.12);color:var(--plum);font-weight:500;border-radius:4px;padding:0 2px}
.twin{display:flex;gap:12px}
.twin .nm{font-size:14px;font-weight:600;margin:6px 0 8px}
.acard{position:relative;background:#fff;border:1px solid var(--ui-line);border-radius:18px;padding:16px 20px;font-size:14px;line-height:22px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-height:56px}
.acard ul{margin:8px 0 8px 18px}.acard li{margin-bottom:4px}.acard li::marker{color:#C9CBD1}.acard strong{font-weight:600}
.think{display:flex;flex-direction:column;gap:7px;overflow:hidden}
.think .ln{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ui-ink-2);opacity:0}
.think .ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #E4DCF0;border-top-color:var(--plum);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{width:16px;height:16px;border-radius:50%;background:#E7F3EC;display:flex;align-items:center;justify-content:center}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;opacity:0}
.srcp{display:inline-flex;align-items:center;gap:6px;background:var(--ui-chip);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ui-ink-2)}
.gbtn{background:var(--ui-chip);border-radius:999px;height:32px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.ph{position:absolute;right:10px;top:-9px;font:600 9px/1 var(--f-ui);letter-spacing:.1em;color:#9a3412;background:#FFEDD5;border:1px solid #FDBA74;border-radius:4px;padding:3px 5px}
body.noph .ph{display:none}
.composer{position:absolute;left:50%;bottom:16px;width:680px;margin-left:-340px;border:1px solid var(--ui-line);border-radius:18px;background:#fff;padding:12px 16px 10px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.composer .tx{font-size:14px;line-height:22px;min-height:22px;color:var(--ui-ink)}
.composer .tx .phd{color:var(--ui-ink-3)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--plum);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--ui-ink-3)}
.composer .send{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ui-ink-3);transition:background .2s,color .2s}
.composer .send.live{background:var(--plum);color:#fff}
/* Agents panel + Placement prep page */
.agpanel{position:absolute;top:0;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--ui-line);box-shadow:-24px 0 48px rgba(17,24,39,.06);padding:20px;z-index:4;transform:translateX(105%)}
.agpanel .ph1{display:flex;justify-content:space-between;align-items:flex-start}
.agpanel .ph1 b{display:block;font-size:16px;font-weight:600}.agpanel .ph1 span{font-size:13px;color:var(--ui-ink-2)}
.agrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;margin-top:22px;background:var(--ui-chip)}
.agrow img{width:40px;height:40px;border-radius:50%}
.agrow b{display:block;font-size:14px;font-weight:600}.agrow span{font-size:13px;color:var(--ui-ink-2)}
.agrow .chev{margin-left:auto;color:var(--ui-ink-3);display:flex}
.pp{position:absolute;inset:0;background:#fff;z-index:5;opacity:0}
.pp-top{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--ui-line)}
.pp-top img{width:36px;height:36px;border-radius:50%}
.pp-top b{display:block;font-size:15px;font-weight:600}.pp-top span{font-size:13px;color:var(--ui-ink-2)}
.pp-top .search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--ui-line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ui-ink-3);width:220px}
.pp-list{width:680px;margin:22px auto 0}
.pp-list h5{font-size:15px;font-weight:600;margin-bottom:10px}
.pp-row{display:flex;align-items:center;gap:14px;padding:10px;border-radius:12px;opacity:0;transition:background .18s}
.pp-row.hover{background:var(--ui-chip)}
.pp-row.pressed{background:rgba(59,9,100,.08)}
.pp-row .ic{width:36px;height:36px;border-radius:10px;background:var(--ui-chip);display:flex;align-items:center;justify-content:center;color:var(--ui-ink-2)}
.pp-row b{display:block;font-size:14px;font-weight:500}.pp-row span{font-size:12px;color:var(--ui-ink-2)}
.pp-row .chev{margin-left:auto;color:var(--ui-ink-3);display:flex}
/* ---------- call layout: left column ---------- */
.side-head{position:absolute;left:150px;top:200px;width:640px;height:200px;font:400 84px/1.05 var(--f-head);z-index:10}
.side-head .h{position:absolute;left:0;top:0}
.leftcol{position:absolute;inset:0;z-index:10;pointer-events:none}
/* student answer card (pass 3): only the student gets a card, only while they answer — no side borders */
.scard{position:absolute;left:150px;top:430px;width:600px;background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(80,30,80,.14);padding:22px 30px 26px}
.scard .th{display:flex;align-items:center;gap:12px;font:600 20px var(--f-ui);color:var(--ink)}
.scard .th img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.scard .role{font-weight:500;color:#8b8592;font-size:16px}
.scard .live{margin-left:auto;display:flex;align-items:center;gap:8px;font:600 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:6px 12px 6px 14px}
.scard .bars{display:flex;gap:3px;align-items:center;height:20px}
.scard .bars i{display:block;width:4px;height:6px;border-radius:2px;background:currentColor}
.scard .q{font:500 28px/1.32 var(--f-ui);color:var(--ink);margin-top:14px}

/* ---------- task page + How it works (5a) ---------- */
.task{position:absolute;inset:0;background:#fff}
.task .body{position:absolute;left:170px;top:96px;font-size:14px}
.task .role{display:flex;align-items:center;gap:10px}
.task .role i{width:36px;height:36px;border-radius:50%;background:var(--ui-chip);display:flex;align-items:center;justify-content:center;color:#6B7280}
.task .pill{font-size:12px;font-weight:600;background:var(--ui-chip);border-radius:6px;padding:3px 7px}
.task .lbl{font-weight:600;margin-top:22px}.task .val{margin-top:8px}
.scrim{position:absolute;inset:0;background:rgba(17,24,39,.42);opacity:0}
.modal{position:absolute;left:50%;top:50%;width:520px;margin:-150px 0 0 -260px;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.25);opacity:0}
.modal .mh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.modal .hw{font-size:13px;font-weight:600;margin:18px 0 10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.steps .st{background:var(--ui-chip);border-radius:12px;height:96px;display:flex;align-items:center;justify-content:center}
.steps .lb{font-size:12px;color:var(--ui-ink-2);margin-top:8px}.steps .lb b{font-weight:600;color:var(--ui-ink);margin-right:4px}
.crit-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ui-line);margin-top:16px;padding-top:14px;font-size:13px;font-weight:600}
.crit-row span{color:var(--ui-ink-2);font-weight:500}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px;min-height:36px}
.file{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;background:var(--ui-chip);border-radius:8px;padding:8px 10px;opacity:0}
.btn-sec{font-size:13px;font-weight:600;border:1px solid var(--ui-line);border-radius:8px;padding:8px 12px;opacity:0}
.btn-pri{display:inline-flex;align-items:center;gap:8px;background:var(--plum);color:#fff;font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;transition:background .25s}
.btn-pri.busy{background:#9C86B8}

/* ---------- New interview page (5t), native px inside .app — matches the shipped page ---------- */
.ni{position:absolute;inset:0;background:#fff}
.ni-top{display:flex;align-items:center;gap:12px;padding:18px 24px}
.ni-top b{display:block;font-size:15px;font-weight:600}
.ni-sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ui-ink-2)}
.ni-sub i{width:18px;height:18px;border-radius:50%;background:var(--plum) url(assets/people/agent.svg) center/cover no-repeat;display:block}
.ni-col{width:820px;margin:22px auto 0}
.ni-lb{font-size:15px;font-weight:600;color:var(--ui-ink)}
.ni-chips{display:flex;align-items:center;gap:10px;margin-top:16px}
.ni-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 18px 0 14px;border:1px solid #E5E7EB;border-radius:999px;font-size:14px;font-weight:500;color:#4B5563;background:#fff;transition:background .18s,border-color .18s,color .18s}
.ni-chip svg{color:#6B7280}
.ni-chip.hv{background:#F3F4F6}
.ni-chip.sel{border-color:var(--ui-ink);color:var(--ui-ink);box-shadow:inset 0 0 0 .6px var(--ui-ink)}
.ni-mw{position:relative}
.ni-more{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 16px;border:1px solid #D1D5DB;border-radius:10px;font-size:15px;font-weight:500;color:var(--ui-ink);background:#fff}
.ni-dd{position:absolute;top:46px;right:0;width:280px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.09);padding:6px;z-index:3;opacity:0}
.ni-dd div{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:8px;font-size:15px;color:var(--ui-ink);transition:background .15s}
.ni-dd div.hv{background:#F3F4F6}.ni-dd svg{color:#6B7280}
.ni-ta{margin-top:16px;height:250px;border:1px solid #D1D5DB;border-radius:22px;position:relative;padding:18px 22px;font-size:15px;color:#6B7280}
.ni-ta .up{position:absolute;left:22px;bottom:16px;display:flex;align-items:center;gap:8px;font-weight:600;color:#4B5563}
.ni-ta .mc{position:absolute;right:22px;bottom:16px;color:#6B7280;display:flex}

/* ---------- scorecard (7), native px inside .app — the shipped attempt page ---------- */
.scp{position:absolute;inset:0;background:#fff}
.sc-hd{position:relative;z-index:2;background:#fff;display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--ui-line)}
.sc-hd .bk{width:32px;height:32px;border-radius:50%;background:var(--ui-chip);display:flex;align-items:center;justify-content:center;color:var(--ui-ink-2)}
.sc-hd .av{width:28px;height:28px;border-radius:50%;object-fit:cover}
.sc-hd b{display:block;font-size:15px;font-weight:600}
.sc-hd .sub{font-size:13px;color:var(--ui-ink-2)}
.sc-vp{position:absolute;left:0;right:0;top:65px;bottom:0;overflow:hidden}
.sc2{position:absolute;left:50%;margin-left:-300px;top:22px;width:600px}
.sc2-row{display:flex;justify-content:space-between;align-items:center}
.sc2 .file{opacity:1;border-radius:999px}
.att{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;color:var(--ui-ink)}
.att svg{color:var(--ui-ink-3)}
.sc2-lbl{font-size:13px;color:var(--ui-ink-2);margin-top:22px}
.sc2-score{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:600;letter-spacing:-.01em;margin-top:2px;min-height:40px}
.dots4{display:inline-flex;gap:4px;align-items:center}
.dots4 i{width:9px;height:9px;border-radius:50%;border:1.3px solid #111827;display:block;transition:background .25s}
.dots4 i.f{background:#111827}
.player{display:flex;align-items:center;gap:12px;background:var(--ui-chip);border-radius:14px;padding:10px 16px;margin-top:18px}
.player .pl{width:34px;height:34px;border-radius:50%;background:var(--plum);display:flex;align-items:center;justify-content:center}
.player .sk{width:20px;height:20px;border-radius:50%;border:1.5px solid #6B7280;font-size:8px;display:flex;align-items:center;justify-content:center;color:#6B7280}
.player .track{flex:1;height:3px;background:#E3E1E8;border-radius:2px;position:relative}
.player .track::before{content:"";position:absolute;left:0;top:-4px;width:11px;height:11px;border-radius:50%;background:#111}

  <div id="hints">Space start · P pause · R restart · 1–8 scenes · H hide</div>

</div>

<script>
/* =====================================================================
   CONFIG — all retiming and on-screen copy lives here
   ===================================================================== */
const NAMES = {                // guardrail 3: real stage names → names shown on screen

const SPACE_NAME = 'AAFT Placements';        // stage says "AAFT Placement Prep" — one-line switch

const TIMELINE = {

  sceneNames: {1:'Title', 2:'What is a Space', 3:'Space Q&A', 4:'Placement prep', 5:'Riya\'s interview', 6:'Bridge + Arjun', 7:'Scorecard', 8:'End card'},
  copy: {

    agent: ['Placement prep','Agent · mock interviews'],
    heads: { '3a':'One Space, <em>the whole batch</em>', '3b':'Answers from <em>AAFT\'s own documents</em>', '3d':'Prepare for <em>every drive</em>',
             '4':'Every recruiter, its own <em>mock interview</em>', '5a':'Practise with <em>their own CV</em>',
             '5t':'Every kind of <em>interview round</em>', '7':'Every attempt, <em>a scorecard</em>' },
    // scene 7 — Arjun's attempt page. PLACEHOLDER: scores and feedback text until copied from a real scored attempt.
    score: { name:'Arjun Sethi', sub:'Assistant Director Trainee · Situational interview · Sat, Nov 14', cv:'Arjun_Sethi_CV.pdf', attempt:'Attempt 2 of 2',
             value:3, of:4, rec:'0:10 / 16:20',
             well:['You protected the shooting day first. Reshuffling to the scenes you could shoot without the lead kept the light and the crew working. Keep leading with the decision that saves the schedule.',
                   'You spoke the language of a set: first AD, scene order, light. That made the answer credible. Keep using the crew\'s terms.'],
             improve:['You didn\'t say who else needs to know. Next time, name the producer and the actor\'s team, and say when you\'d escalate if he isn\'t on set by a fixed time.'],
             crit:[['Prioritisation under pressure',4],['Production knowledge',3],['Communication with crew',3],['Problem solving',3],['Composure',4]] },
    people: { riya:{img:'riya', name:'Riya Malhotra', role:'B.Sc. Digital Marketing'}, arjun:{img:'arjun', name:'Arjun Sethi', role:'B.A. Cinema'} },
    // 5t — the shipped New interview page: Interview type chips + More dropdown (labels as in the product)
    types: ['HR interview','Resume discussion','Case interview'],
    moreTypes: ['Technical interview','Situational interview','Analytics test','Guesstimate round','Other'],
    s8l1: ['Every','question','<em>answered.</em>','Every','interview','<em>practised.</em>'],
    s8l2: ['Placement-ready,','<em>around</em>','<em>the</em>','<em>clock.</em>'],
    disclosure: 'Dramatisation · AI-generated voices and faces',
    // scene 3 — Space Q&A (answers: content/answers.md; 3c is the §8 placeholder until asked on stage)
    seed: { who:'m2', name:'Rohan Verma', q:'@space How long do I have to decline an offer?', time:'16h',
            a:'You have 48 hours from the result to decline an offer, and the decline must be submitted in writing to your CRM. After that, the offer is treated as accepted.',

    a1: { placeholder:true, sources:'2 Sources', think:['Searching Placement Calendar 2026–27','Checking Recruiter Profiles'],
          html:'Eight drives are scheduled in December:<ul><li><strong>Northline Retail</strong> on 2 Dec (Fashion Design)</li><li><strong>Desh Live News</strong> on 4 Dec (Journalism)</li><li><strong>Saffron Frame Studios</strong> on 8 Dec (Cinema)</li><li><strong>Brightlane Media</strong> on 10 Dec (Digital Marketing)</li><li><strong>Ambrosia Hotels</strong> on 11 Dec (Hospitality)</li><li><strong>The Capital Daily</strong> on 15 Dec (Photography)</li><li><strong>Hearth &amp; Hue Interiors</strong> on 17 Dec (Interior Design)</li><li><strong>Pulse News Network</strong> on 18 Dec (tentative)</li></ul>Apply on the CRC portal by the deadline, usually three days before each drive.' },
    q2: '@space Meridian Analytics is coming for Data & AI. What do they ask, and how do I prepare?',
    a2: { placeholder:false, sources:'3 Sources', think:['Searching Recruiter Profiles and Debriefs','Checking Interview Preparation Guide'],
          html:'Meridian Analytics\' online round tests <strong>SQL, Python, and aptitude</strong> for the Analyst – Data &amp; AI role.<ul><li><strong>SQL:</strong> practise joins, aggregations, CTEs, and especially window functions. Be able to solve ranking questions such as finding the top three products by revenue in each region.</li><li><strong>Python:</strong> revise pandas—filtering, merges, missing-value handling, and grouping.</li><li><strong>Aptitude:</strong> practise timed quantitative and logical-reasoning questions.</li></ul>A practical 7-day split: 3 days SQL, 2 days Python/pandas, 1 day aptitude, and 1 full mock plus revision.' },
    // scene 4 — Placement prep list (real list style: "Company · Interview type", status)
    // scene 5a — task page + How it works (real SPJIMR flow, compressed)
    task: { title:'Kissa Audio · Case interview', sub:'Growth Marketing Associate at Kissa Audio.', role:'Senior executive',
            dur:'20 minutes', about:'<b>Kissa Audio.</b> Growth Marketing Associate.', cv:'Riya_Malhotra_CV.pdf', criteria:'6 criteria' },
    // scenes 5b–6 — calls. On-screen prompt text uses ₹ and digits; the voice clips say them in words.
    callRiya:  { who:'Senior executive at Kissa Audio' },
    callArjun: { who:'Line producer at Saffron Frame Studios' },
    p5b: 'You cut cost per install from ₹38 to ₹24. Were those listeners worth keeping?',
    p5c: 'Week one. Option A costs ₹20 an install, and 4% reach a paid episode. Option B costs ₹32, and 14% do. Which do you scale?',
    p6:  'Your lead actor is 90 minutes late, and you lose the light at 5:30. What do you do?',
    s5b: 'Pushed on<br><em>their own numbers</em>',
    s5c: 'A real case,<br><em>not a quiz</em>',
    s6:  'Every school,<br><em>every role</em>',
    riya5b: '"Not at first. So I started judging creatives on day-seven retention."',
    riya5d: '"B. ₹229 per paying listener, against ₹500 for A."',
    arjun6: '"First, I tell the first AD to reshuffle to the scenes we can shoot without him, so we don\'t lose the light."',
    rows: [['Kissa Audio · Case interview','2 attempts'],['Saffron Frame Studios · Situational interview','Not started'],
           ['Northline Retail · Resume discussion','Not started'],['Desh Live News · Case interview','1 attempt'],
           ['Ambrosia Hotels · HR interview','Not started'],['Meridian Analytics · Case interview','Not started'],
           ['Spotlight Live Events · Resume discussion','Not started']],
  },
};
const EASE_OUT = 'cubic-bezier(.16,1,.3,1)', EASE_IN = 'cubic-bezier(.7,0,.84,0)', EASE_IO = 'cubic-bezier(.65,0,.35,1)';

/* =====================================================================
   ENGINE — film clock = AudioContext time, so voices and visuals never drift
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), world = document.getElementById('world');
const $ = id => document.getElementById(id);
const S = { ctx:null, base:0, started:false, paused:false, clips:{}, buffers:{}, voice:[], cues:[], ci:0,
            sources:[], debug: Q.get('debug')==='1', hints:true, singleEnd:null, words:{}, tickers:[],
            musicOn: !!Q.get('music') && Q.get('music') !== '0', musicBuf:null, musicSched:false, musicOut:null };

// letterbox: fixed 1920×1080 stage, scaled to fit, centred
document.body.classList.add('bars-' + (Q.get('bars') || 'black'));
if (Q.get('ph') === '0') document.body.classList.add('noph');        // hide PLACEHOLDER tags for a recording take
function fit(){ const k = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`; }
addEventListener('resize', fit); fit();

const T = () => S.ctx ? S.ctx.currentTime - S.base : (S.seekT || 0);
const A = (el, kf, ms, o={}) => el.animate(kf, {duration:ms, easing:o.ease||EASE_OUT, fill:'forwards', delay:o.delay||0});
const el = (tag, cls, html, parent=world) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; parent.appendChild(e); return e; };
const show = e => { e.getAnimations().forEach(a=>a.cancel()); e.style.opacity=1; };
const fmt = t => `${Math.floor(Math.max(0,t)/60)}:${(Math.max(0,t)%60).toFixed(1).padStart(4,'0')}`;

// absolute start of every voice clip, chained from the scene starts
function layoutVoice(){
  S.voice = [];
  for (const {start, clips: ids} of TIMELINE.beats){
    let t = start + TIMELINE.lead;
    for (const id of ids){ const c = S.clips[id]; S.voice.push({id, t, dur:c.duration, speaker:c.speaker, text:c.text}); t += c.duration + TIMELINE.gap; }
  }
  for (const v of S.voice) S.words[v.id] = (S.clips[v.id].words||[]).map(w => ({w:w[0], t:v.t + w[1]}));
}
// absolute time of the nth word of a clip (fallback: clip start)
const wt = (id, n) => (S.words[id]?.[n]?.t) ?? S.voice.find(v=>v.id===id).t;
// absolute time a word ends · start / end of a beat (by id from content/timeline.json)
const we = (id, n) => { const v = S.voice.find(v=>v.id===id), w = S.clips[id].words?.[n]; return w ? v.t + w[2] : v.t + v.dur; };
const B  = id => TIMELINE.beats.find(b => b.id === id).start;
const BE = id => { const i = TIMELINE.beats.findIndex(b => b.id === id); return TIMELINE.beats[i+1]?.start ?? TIMELINE.end; };

/* ---------- cue scheduling ---------- */
function cue(t, fn){                       // keeps the queue time-sorted, even for cues added mid-play
  let i = S.cues.length;
  while (i > S.ci && S.cues[i-1].t > t) i--;
  S.cues.splice(i, 0, {t, fn});
}
function tick(){
  const t = T();
  while (S.ctx && S.ci < S.cues.length && S.cues[S.ci].t <= t){ try{ S.cues[S.ci].fn(); }catch(e){ console.error(e); } S.ci++; }
  if (S.ctx) S.tickers = S.tickers.filter(f => { try { return !f(t); } catch(e){ console.error(e); return false; } });
  if (S.ctx && !S.paused){
    for (const v of S.voice){
      if (v.sched || v.t > t + 0.25 || v.t + v.dur < t) continue;
      v.sched = true;
      const src = S.ctx.createBufferSource(); src.buffer = S.buffers[v.id];
      src.connect(v.speaker === 'INT' ? S.anInt : (v.speaker === 'RIYA' || v.speaker === 'ARJUN') ? S.anStu : S.ctx.destination);
      const when = S.base + v.t, off = Math.max(0, t - v.t);
      src.start(Math.max(S.ctx.currentTime, when), off);
      S.sources.push(src);
    }
    if (S.musicBuf && !S.musicSched){ S.musicSched = true; scheduleMusic(t); }
    if (S.singleEnd != null && t >= S.singleEnd) togglePause(true);
  }
  if (S.debug){
    const sc = sceneAt(t), now = S.voice.filter(v => t >= v.t && t <= v.t + v.dur);
    $('dbg').innerHTML = `${fmt(t)} · ${sc.key} ${sc.name}${S.paused?' · ⏸':''}` + (now.length ? `<br>${now.map(v=>`<b>${v.speaker}</b> ${v.text}`).join('<br>')}` : '');
  }
  requestAnimationFrame(tick);
}
const sceneAt = t => [...TIMELINE.scenes].reverse().find(s => t >= s.start) || TIMELINE.scenes[0];

// music bed (preview only, ?music=1): per-beat level from timeline.json, ramped across each beat change, faded in and out
function scheduleMusic(t){
  const M = TIMELINE.music, beats = TIMELINE.beats, at = ft => S.base + ft, now = S.ctx.currentTime;
  const lv = id => Math.pow(10, M.db[id] / 20);
  const levelAt = ft => lv([...beats].reverse().find(b => ft >= b.start)?.id ?? beats[0].id);
  const src = S.ctx.createBufferSource(), g = S.ctx.createGain();
  src.buffer = S.musicBuf; src.connect(g).connect(S.musicOut);
  const t0 = Math.max(0, t), from = Math.max(now, at(0));
  const ev = [];                                                    // [film time, gain]
  if (t0 < M.fade_in){ ev.push([t0, 0.0001], [M.fade_in, levelAt(M.fade_in)]); } else ev.push([t0, levelAt(t0)]);
  beats.slice(1).forEach((b, i) => { const a = b.start - M.ramp/2, z = b.start + M.ramp/2;
    if (a > ev.at(-1)[0] + 0.01) ev.push([a, lv(beats[i].id)], [z, lv(b.id)]); });
  const fo = TIMELINE.end - M.fade_out;
  if (fo > ev.at(-1)[0]) ev.push([fo, levelAt(fo)]);
  ev.push([TIMELINE.end, 0.0001]);
  g.gain.setValueAtTime(ev[0][1], from);
  ev.slice(1).forEach(([ft, v]) => g.gain.linearRampToValueAtTime(v, at(ft)));
  src.start(from, t0);
  S.sources.push(src); S.musicGain = g;
}

/* ---------- build, seek, pause ---------- */
function build(fromT){
  world.innerHTML = ''; S.cues = []; S.tickers = []; S.sources.forEach(s=>{try{s.stop()}catch(e){}}); S.sources = [];
  S.voice.forEach(v => v.sched = false); S.musicSched = false;
  E.build();                                   // all persistent elements
  for (const sc of SCENES) sc.cues();          // register every cue
  S.cues.sort((a,b)=>a.t-b.t);
  const sc = sceneAt(fromT);
  SCENES[TIMELINE.scenes.indexOf(sc)].setup(); // static state at that scene's start
  S.ci = S.cues.findIndex(c => c.t >= sc.start); if (S.ci < 0) S.ci = S.cues.length;
  return sc.start;
}
function seek(t){
  const start = build(t);
  if (S.ctx){ S.base = S.ctx.currentTime - start; S.paused = false; S.ctx.resume(); }
  else S.seekT = start;
}
function togglePause(force){
  if (!S.ctx) return;
  S.paused = force ?? !S.paused;
  if (S.paused){ S.ctx.suspend(); document.getAnimations().forEach(a=>a.pause()); }
  else { S.ctx.resume(); document.getAnimations().forEach(a=>{ if(a.playState==='paused') a.play(); }); }
}
async function start(){
  if (S.started || !S.ready) return; S.started = true;
  S.ctx = new AudioContext();
  // level meters: the orb follows the interviewer, the mic button follows the student
  for (const k of ['anInt','anStu']){ const a = S.ctx.createAnalyser(); a.fftSize = 1024; a.connect(S.ctx.destination); S[k] = a; }
  S.lvBuf = new Float32Array(1024); S.lvInt = 0; S.lvStu = 0;
  if (S.musicBuf){ S.musicOut = S.ctx.createGain(); S.musicOut.connect(S.ctx.destination); }
  A($('gate'), [{opacity:1},{opacity:0}], 250, {ease:EASE_IN}).finished.then(()=>$('gate').classList.add('hidden'));
  setHints(S.debug);
  const from = S.seekT || 0;
  S.base = S.ctx.currentTime + 0.15 - from;          // film time `from` lands 150ms from now
  if (Q.get('flash') !== '0' && from === 0){          // sync slate: 1-frame flash + 50ms beep at 0:00
    cue(0, () => { $('flash').style.opacity = 1; setTimeout(()=>$('flash').style.opacity = 0, 50); });
    S.cues.sort((a,b)=>a.t-b.t); S.ci = S.cues.findIndex(c => c.t >= 0);
    const o = S.ctx.createOscillator(), g = S.ctx.createGain(); o.frequency.value = 1000; g.gain.value = .25;
    o.connect(g).connect(S.ctx.destination); o.start(S.base); o.stop(S.base + 0.05);
  }
}
function setHints(on){ S.hints = on; $('hints').classList.toggle('hidden', !on); $('dbg').classList.toggle('hidden', !(on && S.debug)); }

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!S.ready && k !== 'r') return;

const reveal = (span, ms=220) => A(span, [{opacity:0},{opacity:1}], ms, {ease:'ease-out'});
const fadeOut = (e, ms=350, y=-10) => A(e, [{opacity:getComputedStyle(e).opacity, transform:getComputedStyle(e).transform==='none'?'none':getComputedStyle(e).transform},{opacity:0, transform:`translateY(${y}px)`}], ms, {ease:EASE_IN});
const fadeIn = (e, ms=600, y=12) => A(e, [{opacity:0, transform:`translateY(${y}px)`},{opacity:1, transform:'none'}], ms);
/* Headline grammar (one rule for every scene):
   1. the old line lifts out (opacity → 0, −10px, slight blur, ease-in)
   2. a short beat
   3. the new line rises in word by word (70ms apart), so the italic accent word lands last.
   The two never overlap on screen. */
const HEAD = { out: 240, beat: 120, step: 70, wordIn: 460 };
function headExit(o, ms = HEAD.out){
  const op = +getComputedStyle(o).opacity;
  if (op === 0){ o.remove(); return 0; }
  A(o, [{opacity:op, transform:'none', filter:'blur(0px)'},{opacity:0, transform:'translateY(-10px)', filter:'blur(3px)'}], ms, {ease:EASE_IN})
    .finished.then(() => o.remove());
  return ms;
}
// wrap each word of an HTML headline in an inline-block span, keeping <em> styling
function wrapWords(root){
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3){
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(p => {
        if (!p) return;
        if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
        else { const s = document.createElement('span'); s.className = 'hw'; s.style.display = 'inline-block'; s.textContent = p; frag.appendChild(s); }
      });
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && !c.classList.contains('slot')) walk(c);
  });
  walk(root);
  return [...root.querySelectorAll('.hw')];
}
function setHead(html, {words=null, instant=false, box=E.head}={}){
  let wait = 0;
  [...box.children].forEach(o => { wait = Math.max(wait, headExit(o)); });
  const h = el('div','h', html, box);
  if (instant || words) return h;                     // `words`: the caller reveals words itself (scene 1, synced to VO)
  const ws = wrapWords(h), delay = wait ? wait + HEAD.beat : 0;
  ws.forEach((w, i) => { w.style.opacity = 0;
    A(w, [{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}], HEAD.wordIn, {delay: delay + i*HEAD.step}); });
  h.dataset.revealEnd = delay + ws.length*HEAD.step;  // when the last word starts (for slots that follow)
  return h;
}
function clearHead(ms = HEAD.out){ [...E.head.children].forEach(o => headExit(o, ms)); }
// call layout: the headline lives in the left column and follows the same grammar
const setSide = (html, o={}) => setHead(html, {...o, box:E.side});
const clearSide = (ms = HEAD.out) => [...E.side.children].forEach(o => headExit(o, ms));

  if (instant) return;

           {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'}], ms, {ease:EASE_OUT});

function typeInto(text, t0, perChar=0.035){
  U.send.classList.remove('live');
  ticker(t => { if (!U.tx.isConnected) return true;
    const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) / perChar)));

// stream an HTML answer one visible character at a time (tags/entities count as one)
function htmlSlice(html, n){ let out = '', seen = 0, i = 0;
  while (i < html.length && seen < n){
    if (html[i] === '<'){ const j = html.indexOf('>', i); out += html.slice(i, j+1); i = j+1; continue; }
    if (html[i] === '&'){ const j = html.indexOf(';', i); out += html.slice(i, j+1); i = j+1; seen++; continue; }
    out += html[i++]; seen++; }
  return out; }

function streamInto(r, html, t0, cps){
  const total = visLen(html);
  ticker(t => { if (!r.ans.isConnected) return true;
    const n = Math.max(0, Math.min(total, Math.floor((t - t0) * cps)));
    r.ans.innerHTML = htmlSlice(html, n); return n >= total; });
  return t0 + total / cps;                       // when the stream finishes
}

function buildCall(cfg, {prompt='', timer=1200}={}){
  E.body.innerHTML = `<div class="app"><div class="call">
      <div class="who"><i>${ICON.user}</i><div><b>${cfg.who}</b><span>AI role-play</span></div></div>
      <span class="res">${ICON.book}Resources</span><span class="mo">···</span>
      <div class="orbw"><div class="orb"><div class="halo"></div><div class="wash"></div><div class="rot ring"></div><div class="rot rays"></div>
        <div class="core">${ICON.userL}</div></div></div>
      <div class="left"></div><div class="prompt">${prompt}</div>
      <div class="ctrls"><span class="end">${ICON.hangup}</span><span class="mic">${ICON.micL}</span></div></div></div>`;
  const q = s => E.body.querySelector(s);
  Object.assign(U, { call:q('.call'), rots:[...E.body.querySelectorAll('.orb .rot')], ring:q('.orb .ring'), halo:q('.orb .halo'),
                     left:q('.call .left'), prompt:q('.call .prompt'), mic:q('.ctrls .mic'), end:q('.ctrls .end'),
                     angle:180, lastT:null, timer0:timer, timerT:null });
  const rms = an => { an.getFloatTimeDomainData(S.lvBuf); let s = 0; for (const v of S.lvBuf) s += v*v; return Math.min(1, Math.sqrt(s/S.lvBuf.length)*5); };
  ticker(t => { if (!U.call || !U.call.isConnected) return true;
    const dt = U.lastT == null ? 0 : Math.max(0, Math.min(.05, t - U.lastT)); U.lastT = t;
    if (S.anInt){ const a = rms(S.anInt), b = rms(S.anStu);
      S.lvInt += (a - S.lvInt) * (a > S.lvInt ? .35 : .07); S.lvStu += (b - S.lvStu) * (b > S.lvStu ? .35 : .07); }
    const talk = S.lvInt > .02, lv = S.lvInt;
    U.angle = (U.angle + (talk ? 34 + lv*40 : 18) * dt) % 360;     // ~one turn per 8s while speaking, as recorded
    const sc = 1 + lv*.07;
    U.rots.forEach(r => r.style.transform = `rotate(${U.angle}deg) scale(${sc})`);
    U.ring.style.opacity = .82 + lv*.18; U.halo.style.transform = `scale(${1 + lv*.12})`;
    U.mic.style.setProperty('--lvl', S.lvStu.toFixed(3));
    if (U.timerT != null){ const r = Math.max(0, Math.round(U.timer0 - (t - U.timerT))); U.left.textContent = `${Math.floor(r/60)}:${String(r%60).padStart(2,'0')} left`; }
    return false; });
}
function setTimer(sec, t0){ U.timer0 = sec; U.timerT = t0; }
// interviewer transcript appears as it's spoken (linear over the clip; ₹ text differs from the spoken words)
function setPrompt(text, t0, dur){
  U.prompt.textContent = '';
  ticker(t => { if (!U.prompt || !U.prompt.isConnected) return true;
    const n = Math.max(0, Math.min(text.length, Math.ceil(text.length * (t - t0) / (dur * .92))));
    U.prompt.textContent = text.slice(0, n); return n >= text.length; });
}

  const bars = [...c.querySelectorAll('.bars i')], live = c.querySelector('.live'), k = [1, 1.7, 1.25, 2.1, 1.45];

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  const [tl, m] = await Promise.all(['content/timeline.json', 'assets/audio/clips.json'].map(async u => (await fetch(u, {cache:'no-store'})).json()));
  Object.assign(TIMELINE, {beats: tl.beats, lead: tl.lead, gap: tl.gap, end: tl.end, music: tl.music});
  const keys = Object.entries(tl.keys).map(([k, id]) => [+k, id]).sort((a,b) => a[0]-b[0]);
  TIMELINE.scenes = keys.map(([k, id], i) => ({key:k, id, name:TIMELINE.sceneNames[k], start:B(id), end: keys[i+1] ? B(keys[i+1][1]) : tl.end}));
  S.clips = m; layoutVoice();
  const ctxTmp = new OfflineAudioContext(1, 1, 44100);
  const load = async (v, tries=4) => {                 // retry: the local dev server drops parallel requests
    for (let i = 0; i < tries; i++){
      try { const r = await fetch(S.clips[v.id].file, {cache:'no-store'}); if (!r.ok) throw new Error(r.status);
            S.buffers[v.id] = await ctxTmp.decodeAudioData(await r.arrayBuffer()); return; }
      catch(e){ await new Promise(r => setTimeout(r, 250*(i+1))); }
    }
    throw new Error('could not load ' + v.id);
  };
  for (let i = 0; i < S.voice.length; i += 4) await Promise.all(S.voice.slice(i, i+4).map(v => load(v)));
  if (S.musicOn){                                   // preview only: the bed under the voices, levels from content/timeline.json
    // ?music=1 → the bed named in timeline.json; ?music=c (or d, e, b…) → assets/music/bed_<x>_fit.mp3, for comparing beds
    const pick = Q.get('music'), file = /^[a-z]$/.test(pick) ? `assets/music/bed_${pick}_fit.mp3` : TIMELINE.music.file;
    const r = await fetch(file, {cache:'no-store'}); S.musicBuf = await ctxTmp.decodeAudioData(await r.arrayBuffer()); S.musicFile = file;
    $('hints').innerHTML += ' · M music on/off';
    $('musicNote').textContent = `Music preview ON: ${S.musicFile.split('/').pop()} under the voices (M turns it off). Do not record in this mode.`;
  }
  await document.fonts.ready;
  let from = +(Q.get('t') || 0);
  const m2 = location.hash.match(/^#scene-(\d)$/);
  if (m2){ const sc = TIMELINE.scenes[+m2[1]-1]; from = sc.start; S.singleEnd = sc.end; }
  seek(from);
  setHints(true);
  S.ready = true;                                   // Space works only once every clip is decoded
  $('gate').querySelector('b').textContent = 'Press Space to start';
  requestAnimationFrame(tick);
})();
